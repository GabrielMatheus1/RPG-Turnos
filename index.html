<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#1f2933">
    <title>RPG Turnos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <main class="game-screen">
        <canvas id="game" width="640" height="480"></canvas>
    </main>

    <nav class="mobile-controls" aria-label="Controles de movimento">
        <button class="control-button up" type="button" data-key="arrowup" aria-label="Mover para cima">&#9650;</button>
        <button class="control-button left" type="button" data-key="arrowleft" aria-label="Mover para esquerda">&#9664;</button>
        <button class="control-button down" type="button" data-key="arrowdown" aria-label="Mover para baixo">&#9660;</button>
        <button class="control-button right" type="button" data-key="arrowright" aria-label="Mover para direita">&#9654;</button>
    </nav>


    <script type="module" src="script.js"></script>
    
</body>
</html>
